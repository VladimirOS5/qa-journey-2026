name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r phase-3-ui-automation/requirements.txt || echo "No UI requirements yet"

    - name: Run UI tests
      run: |
        cd phase-3-ui-automation
        pytest --alluredir=allure-results || echo "No UI tests yet"
      continue-on-error: true

  api-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r phase-4-api-automation/requirements.txt || echo "No API requirements yet"

    - name: Run API tests
      run: |
        cd phase-4-api-automation
        pytest || echo "No API tests yet"
      continue-on-error: true
